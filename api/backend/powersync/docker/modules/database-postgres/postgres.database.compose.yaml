services:
  pg-db:
    image: postgres:18
    restart: always

    environment:
      - POSTGRES_USER=${PS_DATABASE_USER}
      - POSTGRES_DB=${PS_DATABASE_NAME}
      - POSTGRES_PASSWORD=${PS_DATABASE_PASSWORD}
      - PGPORT=${PS_DATABASE_PORT}

    volumes:
      - pg_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d

    ports:
      - '${PS_DATABASE_HOST_PORT}:${PS_DATABASE_PORT}'

    command:
      - postgres
      - -c
      - wal_level=logical

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PS_DATABASE_USER} -d ${PS_DATABASE_NAME} -p ${PS_DATABASE_PORT}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: