config:
  edition: 3

streams:
  global:
    auto_subscribe: true
    queries:
      - SELECT * FROM species
      - SELECT * FROM questions
      - SELECT * FROM question_options
      - SELECT * FROM question_option_photos
      - SELECT * FROM species_traits

  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM observations WHERE user_id = auth.user_id()
      - |
        SELECT * FROM observation_photos WHERE observation_id IN (
          SELECT id FROM observations WHERE user_id = auth.user_id()
        )
      - SELECT * FROM notifications WHERE CAST(user_id AS TEXT) = auth.user_id()